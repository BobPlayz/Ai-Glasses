name: Firmware compile check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile candidate firmware
        run: pio run -d firmware/xiao-esp32s3-sense
